name: Build HUSH Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HUSH_Android_Capacitor_Source.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract HUSH source
        run: |
          mkdir app
          unzip HUSH_Android_Capacitor_Source.zip -d app

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Create Android project
        working-directory: app
        run: npx cap add android

      - name: Sync Android project
        working-directory: app
        run: npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HUSH-Android-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
